services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathon}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    profiles: ['app']
    build: .
    env_file: .env
    environment:
      POSTGRESQL_DSN: postgres://${POSTGRES_USER:-hackathon}:${POSTGRES_PASSWORD:-hackathon}@postgres:5432/${POSTGRES_DB:-hackathon}?sslmode=disable
      STORAGE_DIRECTORY: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    volumes:
      - storage-data:/app/storage
volumes:
  postgres-data:
  storage-data:
