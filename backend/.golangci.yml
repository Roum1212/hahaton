version: "2"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Roum1212/hahaton/)
        - blank
        - dot
    gofumpt:
      extra-rules: true
      module-path: github.com/Roum1212/hahaton

issues:
  fix: false
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  disable:
    - dupl
    - dupword
    - err113
    - exhaustruct
    - funlen
    - ginkgolinter
    - gochecknoglobals
    - gocyclo
    - goheader
    - gomodguard
    - gosmopolitan
    - ireturn
    - loggercheck
    - maintidx
    - nonamedreturns
    - reassign
    - revive
    - testpackage
    - varnamelen
    - wrapcheck
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - grouper
    - govet
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - lll
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wsl_v5
    - zerologlint

  exclusions:
    paths:
      - genproto
    rules:
      - path: tests/integration/repository/fixture/
        linters:
          - mnd
      - path: _test\.go
        linters:
          - contextcheck

  settings:
    copyloopvar:
      check-alias: true

    cyclop:
      max-complexity: 30

    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/Roum1212/hahaton
            - aidanwoods.dev/go-paseto
            - connectrpc.com/authn
            - connectrpc.com/connect
            - connectrpc.com/cors
            - github.com/Masterminds/squirrel
            - github.com/caarlos0/env/v10
            - github.com/coreos/go-oidc/v3
            - github.com/go-jose/go-jose/v4
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
            - github.com/stretchr/testify
            - github.com/testcontainers/testcontainers-go
            - github.com/rs/cors
            - go.flida.dev/cookies
            - go.flida.dev/rpc-error
            - google.golang.org/genproto
            - google.golang.org/protobuf
            - golang.org/x/net

    lll:
      line-length: 120

    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
      exclude-functions:
        - (*strings.Builder).WriteString
        - crypto/rand.Read
        - encoding/json.Marshal
        - encoding/json.MarshalIndent

    errchkjson:
      check-error-free-encoding: true

    exhaustive:
      check:
        - map
        - switch

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^((==|!=) "")$
        - pattern: ^(fmt\\.Print(|f|ln)|goto|print(|ln))$
        - pattern: ^(http\\.Default(Client|Transport))$
        - pattern: ^(time\\.Sleep)$

    gochecksumtype:
      default-signifies-exhaustive: false

    gocognit:
      min-complexity: 30

    goconst:
      ignore-calls: true
      max: 0
      min: 0
      min-len: 2
      min-occurrences: 2

    gocritic:
      disabled-checks:
        - hugeParam
        - sloppyReassign
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      settings:
        nestingReduce:
          bodyWidth: 2
        tooManyResultsChecker:
          maxResults: 2
        truncateCmp:
          skipArchDependent: false
        underef:
          skipRecvDeref: false
        unnamedResult:
          checkExported: true

    godot:
      capital: false
      period: true
      scope: all

    godox:
      keywords:
        - BUG
        - FIXME
        - HACK
        - OPTIMIZE

    grouper:
      import-require-grouping: true

    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true

    misspell:
      locale: US
      ignore-rules:
        - cancelled

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-functions:
        - make
        - strings.SplitN

    musttag:
      functions: [ ]

    nakedret:
      max-func-lines: 0

    nestif:
      min-complexity: 3

    nilnil:
      checked-types:
        - chan
        - func
        - iface
        - map
        - ptr

    nolintlint:
      require-explanation: false
      require-specific: true

    prealloc:
      for-loops: true

    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003

    tagliatelle:
      case:
        rules:
          bson: snake
          env: upperSnake
          json: snake

    usestdlibvars:
      constant-kind: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      time-layout: true
      time-month: true
      tls-signature-scheme: true

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 0

output:
  formats:
    text:
      colors: true
      path: stderr
      print-issued-lines: true
      print-linter-name: true
  show-stats: true
  sort-order:
    - linter
    - file

run:
  concurrency: 2
  modules-download-mode: mod
