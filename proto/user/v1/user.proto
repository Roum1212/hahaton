syntax = "proto3";

package user.v1;

import "common/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/user/v1;user_v1";

service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {}
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {}
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
}

message User {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  string first_name = 3 [json_name = "first_name"];
  string last_name = 4 [json_name = "last_name"];
  UserRole role = 5 [json_name = "role"];
  bool active = 6 [json_name = "active"];
  google.protobuf.Timestamp created_at = 7 [json_name = "created_at"];
}

message ListUsersRequest {
  common.v1.PageRequest page = 1 [json_name = "page"];
  string search = 2 [json_name = "search"];
}

message ListUsersResponse {
  repeated User users = 1 [json_name = "users"];
  int32 total = 2 [json_name = "total"];
}

message GetUserRequest {
  string id = 1 [json_name = "id"];
}

message GetUserResponse {
  User user = 1 [json_name = "user"];
}

message CreateUserRequest {
  string email = 1 [json_name = "email"];
  string first_name = 2 [json_name = "first_name"];
  string last_name = 3 [json_name = "last_name"];
  UserRole role = 4 [json_name = "role"];
}

message CreateUserResponse {
  User user = 1 [json_name = "user"];
}

message UpdateUserRequest {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  string first_name = 3 [json_name = "first_name"];
  string last_name = 4 [json_name = "last_name"];
  UserRole role = 5 [json_name = "role"];
  bool active = 6 [json_name = "active"];
}

message UpdateUserResponse {
  User user = 1 [json_name = "user"];
}

message DeleteUserRequest {
  string id = 1 [json_name = "id"];
}

message DeleteUserResponse {}
