syntax = "proto3";

package participation.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/participation/v1;participation_v1";

service ParticipationService {
  rpc RequestParticipation(RequestParticipationRequest) returns (RequestParticipationResponse) {}
  rpc RestoreParticipation(RestoreParticipationRequest) returns (google.protobuf.Empty) {}
  rpc ApproveParticipation(ApproveParticipationRequest) returns (google.protobuf.Empty) {}
  rpc RejectParticipation(RejectParticipationRequest) returns (google.protobuf.Empty) {}
  rpc CancelParticipation(CancelParticipationRequest) returns (google.protobuf.Empty) {}
  rpc GetParticipation(GetParticipationRequest) returns (GetParticipationResponse) {}
  rpc ListParticipations(ListParticipationsRequest) returns (ListParticipationsResponse) {}
  rpc ListParticipationChanges(ListParticipationChangesRequest) returns (ListParticipationChangesResponse) {}
}

message Participation {
  string id = 1 [json_name = "id"];

  string event_id = 2 [json_name = "event_id"];
  string volunteer_id = 3 [json_name = "volunteer_id"];

  ParticipationCancellationReason cancellation_reason = 4 [json_name = "cancellation_reason"];
  optional string rejection_reason = 5 [json_name = "rejection_reason"];
  ParticipationStatus status = 6 [json_name = "status"];

  optional string accrual_operation_id = 7 [json_name = "accrual_operation_id"];
  optional int64 awarded_coins = 8 [json_name = "awarded_coins"];
  optional int64 awarded_minutes = 9 [json_name = "awarded_minutes"];

  google.protobuf.Timestamp created_at = 10 [json_name = "created_at"];
  google.protobuf.Timestamp updated_at = 11 [json_name = "updated_at"];
}

enum ParticipationStatus {
  PARTICIPATION_STATUS_UNSPECIFIED = 0;
  PARTICIPATION_STATUS_PENDING = 1;
  PARTICIPATION_STATUS_APPROVED = 2;
  PARTICIPATION_STATUS_REJECTED = 3;
  PARTICIPATION_STATUS_CONFIRMED = 4;
  PARTICIPATION_STATUS_NOT_ATTENDED = 5;
  PARTICIPATION_STATUS_CANCELLED = 6;
  PARTICIPATION_STATUS_CLOSED = 7;
}

enum ParticipationCancellationReason {
  PARTICIPATION_CANCELLATION_REASON_UNSPECIFIED = 0;
  PARTICIPATION_CANCELLATION_REASON_VOLUNTEER_CANCELLED = 1;
  PARTICIPATION_CANCELLATION_REASON_COOPERATION_TERMINATED = 2;
  PARTICIPATION_CANCELLATION_REASON_EVENT_CANCELLED = 3;
}

message RequestParticipationRequest {
  string event_id = 1 [json_name = "event_id"];
}

message RequestParticipationResponse {
  string id = 1 [json_name = "id"];
}

message RestoreParticipationRequest {
  string id = 1 [json_name = "id"];
}

message ApproveParticipationRequest {
  string id = 1 [json_name = "id"];
}

message RejectParticipationRequest {
  string id = 1 [json_name = "id"];

  optional string reason = 2 [json_name = "reason"];
}

message CancelParticipationRequest {
  string id = 1 [json_name = "id"];
}

message GetParticipationRequest {
  string id = 1 [json_name = "id"];
}

message GetParticipationResponse {
  Participation participation = 1 [json_name = "participation"];
}

enum ParticipationListScope {
  PARTICIPATION_LIST_SCOPE_UNSPECIFIED = 0;
  PARTICIPATION_LIST_SCOPE_MY_APPLICATIONS = 1;
  PARTICIPATION_LIST_SCOPE_MY_EVENTS = 2;
}

message ListParticipationsRequest {
  ParticipationListScope scope = 1 [json_name = "scope"];

  optional string event_id = 2 [json_name = "event_id"];
  optional ParticipationStatus status = 3 [json_name = "status"];
  optional string volunteer_id = 4 [json_name = "volunteer_id"];

  int32 limit = 5 [json_name = "limit"];
  int64 offset = 6 [json_name = "offset"];
}

message ListParticipationsResponse {
  repeated Participation participations = 1 [json_name = "participations"];
  int64 total_count = 2 [json_name = "total_count"];
}

message ParticipationChange {
  uint64 sequence = 1 [json_name = "sequence"];

  ParticipationCancellationReason cancellation_reason = 2 [json_name = "cancellation_reason"];
  optional string rejection_reason = 3 [json_name = "rejection_reason"];
  ParticipationStatus status = 4 [json_name = "status"];

  oneof actor {
    string coordinator_id = 5 [json_name = "coordinator_id"];
    string volunteer_id = 6 [json_name = "volunteer_id"];
  }

  google.protobuf.Timestamp created_at = 7 [json_name = "created_at"];
}

message ListParticipationChangesRequest {
  string participation_id = 1 [json_name = "participation_id"];
  int32 limit = 2 [json_name = "limit"];
  int64 offset = 3 [json_name = "offset"];
}

message ListParticipationChangesResponse {
  repeated ParticipationChange changes = 1 [json_name = "changes"];
  int64 total_count = 2 [json_name = "total_count"];
}
