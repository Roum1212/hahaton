syntax = "proto3";

package updates.v1;

option go_package = "github.com/Roum1212/hahaton/genproto/updates/v1;updates_v1";

service UpdatesService {
  rpc SubscribeUpdates(SubscribeUpdatesRequest) returns (stream SubscribeUpdatesResponse) {}
}

message SubscribeUpdatesRequest {}

message SubscribeUpdatesResponse {
  UpdateKind kind = 1 [json_name = "kind"];
}

enum UpdateKind {
  UPDATE_KIND_UNSPECIFIED = 0;
  UPDATE_KIND_READY = 1;
  UPDATE_KIND_CHANGED = 2;
  UPDATE_KIND_HEARTBEAT = 3;
}
