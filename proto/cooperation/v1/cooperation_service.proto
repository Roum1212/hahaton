syntax = "proto3";

package cooperation.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/cooperation/v1;cooperation_v1";

service CooperationService {
  rpc RequestCooperation(RequestCooperationRequest) returns (RequestCooperationResponse) {}
  rpc ApproveCooperation(ApproveCooperationRequest) returns (google.protobuf.Empty) {}
  rpc RejectCooperation(RejectCooperationRequest) returns (google.protobuf.Empty) {}
  rpc TerminateCooperation(TerminateCooperationRequest) returns (google.protobuf.Empty) {}
  rpc GetCooperation(GetCooperationRequest) returns (GetCooperationResponse) {}
  rpc ListCooperations(ListCooperationsRequest) returns (ListCooperationsResponse) {}
  rpc CreateCooperationInvitation(CreateCooperationInvitationRequest) returns (CreateCooperationInvitationResponse) {}
  rpc ListCooperationInvitations(ListCooperationInvitationsRequest) returns (ListCooperationInvitationsResponse) {}
  rpc RevokeCooperationInvitation(RevokeCooperationInvitationRequest) returns (google.protobuf.Empty) {}
  rpc AcceptCooperationInvitation(AcceptCooperationInvitationRequest) returns (AcceptCooperationInvitationResponse) {}
}

message Cooperation {
  string coordinator_id = 1 [json_name = "coordinator_id"];
  string volunteer_id = 2 [json_name = "volunteer_id"];

  CooperationStatus status = 3 [json_name = "status"];

  optional google.protobuf.Timestamp retry_after = 4 [json_name = "retry_after"];

  google.protobuf.Timestamp created_at = 5 [json_name = "created_at"];
  google.protobuf.Timestamp updated_at = 6 [json_name = "updated_at"];
}

enum CooperationStatus {
  COOPERATION_STATUS_UNSPECIFIED = 0;
  COOPERATION_STATUS_PENDING = 1;
  COOPERATION_STATUS_ACTIVE = 2;
  COOPERATION_STATUS_REJECTED = 3;
  COOPERATION_STATUS_TERMINATED = 4;
}

message RequestCooperationRequest {
  string coordinator_id = 1 [json_name = "coordinator_id"];
}

message RequestCooperationResponse {
  Cooperation cooperation = 1 [json_name = "cooperation"];
}

message ApproveCooperationRequest {
  string volunteer_id = 1 [json_name = "volunteer_id"];
}

message RejectCooperationRequest {
  string volunteer_id = 1 [json_name = "volunteer_id"];
}

message TerminateCooperationRequest {
  oneof counterpart {
    string coordinator_id = 1 [json_name = "coordinator_id"];
    string volunteer_id = 2 [json_name = "volunteer_id"];
  }
}

message GetCooperationRequest {
  oneof counterpart {
    string coordinator_id = 1 [json_name = "coordinator_id"];
    string volunteer_id = 2 [json_name = "volunteer_id"];
  }
}

message GetCooperationResponse {
  Cooperation cooperation = 1 [json_name = "cooperation"];
}

enum CooperationListScope {
  COOPERATION_LIST_SCOPE_UNSPECIFIED = 0;
  COOPERATION_LIST_SCOPE_AS_VOLUNTEER = 1;
  COOPERATION_LIST_SCOPE_AS_COORDINATOR = 2;
}

message ListCooperationsRequest {
  CooperationListScope scope = 1 [json_name = "scope"];

  optional CooperationStatus status = 2 [json_name = "status"];

  int32 limit = 3 [json_name = "limit"];
  int64 offset = 4 [json_name = "offset"];
}

message ListCooperationsResponse {
  repeated Cooperation cooperations = 1 [json_name = "cooperations"];
  int64 total_count = 2 [json_name = "total_count"];
}

message CooperationInvitation {
  string id = 1 [json_name = "id"];

  string coordinator_id = 2 [json_name = "coordinator_id"];

  string invitation_url = 3 [json_name = "invitation_url"];

  google.protobuf.Timestamp created_at = 4 [json_name = "created_at"];
  optional google.protobuf.Timestamp expires_at = 5 [json_name = "expires_at"];
}

message CreateCooperationInvitationRequest {
  optional google.protobuf.Timestamp expires_at = 1 [json_name = "expires_at"];
}

message CreateCooperationInvitationResponse {
  CooperationInvitation invitation = 1 [json_name = "invitation"];
}

message RevokeCooperationInvitationRequest {
  string id = 1 [json_name = "id"];
}

message AcceptCooperationInvitationRequest {
  string token = 1 [json_name = "token"];
}

message AcceptCooperationInvitationResponse {
  Cooperation cooperation = 1 [json_name = "cooperation"];
}

message ListCooperationInvitationsRequest {
  bool include_expired = 1 [json_name = "include_expired"];

  int32 limit = 2 [json_name = "limit"];
  int64 offset = 3 [json_name = "offset"];
}

message ListCooperationInvitationsResponse {
  repeated CooperationInvitation invitations = 1 [json_name = "invitations"];
  int64 total_count = 2 [json_name = "total_count"];
}
