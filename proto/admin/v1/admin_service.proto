syntax = "proto3";

package admin.v1;

import "event/v1/event_service.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/admin/v1;admin_v1";

service AdminService {
  rpc FindVolunteers(FindVolunteersRequest) returns (FindVolunteersResponse) {}
  rpc CreateCoordinator(CreateCoordinatorRequest) returns (CreateCoordinatorResponse) {}
  rpc ForceCompleteEvent(ForceCompleteEventRequest) returns (ForceCompleteEventResponse) {}
}

message AdminVolunteer {
  string id = 1 [json_name = "id"];

  string avatar_url = 2 [json_name = "avatar_url"];
  string first_name = 3 [json_name = "first_name"];
  string last_name = 4 [json_name = "last_name"];
  string middle_name = 5 [json_name = "middle_name"];

  string email_address = 6 [json_name = "email_address"];
  string phone_number = 7 [json_name = "phone_number"];

  bool has_coordinator_profile = 8 [json_name = "has_coordinator_profile"];
}

message FindVolunteersRequest {
  oneof criterion {
    string email_address = 1 [json_name = "email_address"];
    string phone_number = 2 [json_name = "phone_number"];
    string volunteer_id = 3 [json_name = "volunteer_id"];
  }

  int32 limit = 4 [json_name = "limit"];
  int64 offset = 5 [json_name = "offset"];
}

message FindVolunteersResponse {
  repeated AdminVolunteer volunteers = 1 [json_name = "volunteers"];
  int64 total_count = 2 [json_name = "total_count"];
}

message CreateCoordinatorRequest {
  string volunteer_id = 1 [json_name = "volunteer_id"];

  string avatar_path = 2 [json_name = "avatar_path"];
  string description = 3 [json_name = "description"];

  optional int64 cooperation_request_cooldown_seconds = 4 [json_name = "cooperation_request_cooldown_seconds"];
}

message CreateCoordinatorResponse {
  string id = 1 [json_name = "id"];
}

message ForceCompleteEventRequest {
  string id = 1 [json_name = "id"];
}

message ForceCompleteEventResponse {
  event.v1.Event event = 1 [json_name = "event"];
}
