syntax = "proto3";

package auth.v1;

import "user/v1/user.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/auth/v1;auth_v1";

service AuthService {
  rpc LoginWithFlida(LoginWithFlidaRequest) returns (LoginWithFlidaResponse) {}
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {}
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  rpc Me(MeRequest) returns (MeResponse) {}
}

message LoginWithFlidaRequest {
  string flida_access_token = 1 [json_name = "flida_access_token"];
}

message LoginWithFlidaResponse {
  string access_token = 1 [json_name = "access_token"];
}

message RefreshTokenRequest {}

message RefreshTokenResponse {
  string access_token = 1 [json_name = "access_token"];
}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  user.v1.User user = 1 [json_name = "user"];
}
