syntax = "proto3";

package coordinator.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/coordinator/v1;coordinator_v1";

service CoordinatorService {
  rpc GetCoordinator(GetCoordinatorRequest) returns (GetCoordinatorResponse) {}
  rpc ListCoordinators(ListCoordinatorsRequest) returns (ListCoordinatorsResponse) {}
  rpc UpdateCoordinator(UpdateCoordinatorRequest) returns (google.protobuf.Empty) {}
  rpc GetCoordinatorSettings(GetCoordinatorSettingsRequest) returns (GetCoordinatorSettingsResponse) {}
  rpc UpdateCoordinatorSettings(UpdateCoordinatorSettingsRequest) returns (google.protobuf.Empty) {}
}

message Coordinator {
  string id = 1 [json_name = "id"];

  string avatar_url = 2 [json_name = "avatar_url"];
  string description = 3 [json_name = "description"];
  string display_name = 4 [json_name = "display_name"];
}

message GetCoordinatorRequest {
  optional string id = 1 [json_name = "id"];
}

message GetCoordinatorResponse {
  Coordinator coordinator = 1 [json_name = "coordinator"];
}

message ListCoordinatorsRequest {
  int32 limit = 1 [json_name = "limit"];
  int64 offset = 2 [json_name = "offset"];
}

message ListCoordinatorsResponse {
  repeated Coordinator coordinators = 1 [json_name = "coordinators"];
  int64 total_count = 2 [json_name = "total_count"];
}

message UpdateCoordinatorRequest {
  optional string avatar_path = 1 [json_name = "avatar_path"];
  optional string description = 2 [json_name = "description"];
}

message CoordinatorSettings {
  int64 cooperation_request_cooldown_seconds = 1 [json_name = "cooperation_request_cooldown_seconds"];
}

message GetCoordinatorSettingsRequest {}

message GetCoordinatorSettingsResponse {
  CoordinatorSettings settings = 1 [json_name = "settings"];
}

message UpdateCoordinatorSettingsRequest {
  optional int64 cooperation_request_cooldown_seconds = 1 [json_name = "cooperation_request_cooldown_seconds"];
}
