syntax = "proto3";

package event.v1;

import "geo/v1/geo_service.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/event/v1;event_v1";

// Все методы требуют авторизации; действующий участник — user_id из сессии.
// Координаторские команды требуют Coordinator с этим ID и владения мероприятием.
service EventService {
  // Только координатор. Создаёт сразу опубликованное мероприятие без черновика.
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {}
  // Доступно создателю и волонтёрам с активной кооперацией с ним.
  // После прекращения кооперации доступ сохраняется по собственной записи
  // в любом историческом статусе. Сохранённая карточка не расширяет доступ к каталогу.
  // Чтение истории не даёт доступа к чату или новой записи.
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {}
  // scope явно выбирает каталог партнёров либо собственные мероприятия координатора.
  // История собственных участий доступна через ParticipationService.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {}
  // Только создатель. До начала PUBLISHED и только без PENDING/APPROVED заявок.
  // При наличии хотя бы одной такой заявки запрещены изменения ЛЮБЫХ полей.
  // Проверки ограничений и сохранение выполняются в одной транзакции,
  // согласованной с созданием и одобрением заявок на участие.
  rpc UpdateEvent(UpdateEventRequest) returns (google.protobuf.Empty) {}
  // Только создатель и только до начала опубликованного мероприятия.
  // В одной транзакции отменяет мероприятие, переводит PENDING/APPROVED в CANCELLED
  // с причиной EVENT_CANCELLED и освобождает места. Начислений нет.
  // Мероприятие и участия в конечных статусах сохраняются.
  rpc CancelEvent(CancelEventRequest) returns (google.protobuf.Empty) {}
  // Только создатель, PUBLISHED и серверное now >= ends_at. Полный окончательный
  // список: ровно одна строка на каждое текущее APPROVED участие, без лишних/пропусков.
  // Одна транзакция: CONFIRMED/NOT_ATTENDED, закрытие PENDING, операции, баланс,
  // минуты, COMPLETED и запрет записи в чат. Успех означает уже обновлённые итоги.
  // После фиксации транзакции стримы чата доставляют оставшиеся доступные сообщения
  // и успешно завершаются; клиент перечитывает GetEventChat и переходит в режим чтения.
  // После завершения правки запрещены; повтор не начисляет повторно.
  rpc CompleteEvent(CompleteEventRequest) returns (CompleteEventResponse) {}
}

message Event {
  string id = 1 [json_name = "id"];

  // Неизменяемый идентификатор создавшего мероприятие координатора.
  string coordinator_id = 2 [json_name = "coordinator_id"];

  string description = 3 [json_name = "description"];
  string title = 5 [json_name = "title"];

  // Дополнительное текстовое описание места; область поиска определяется точкой.
  string location = 4 [json_name = "location"];
  // Обязательная точка на карте, WGS84; не выводится из location на сервере.
  geo.v1.GeoPoint point = 16 [json_name = "point"];

  google.protobuf.Timestamp starts_at = 6 [json_name = "starts_at"];

  google.protobuf.Timestamp ends_at = 7 [json_name = "ends_at"];

  // Все перечисленные требования обязательны одновременно; пустой список означает отсутствие требований.
  // Не более одного возрастного порога. Повторы, неизвестные значения и UNSPECIFIED недопустимы.
  repeated EventCandidateRequirement candidate_requirements = 13 [json_name = "candidate_requirements"];
  // Больше нуля. Ожидающие одобрения заявки места не занимают.
  int32 volunteer_limit = 8 [json_name = "volunteer_limit"];

  EventStatus status = 12 [json_name = "status"];

  // Вычисляемые счётчики текущих записей; клиент не может их изменять.
  int32 approved_participant_count = 14 [json_name = "approved_participant_count"];
  int32 pending_application_count = 15 [json_name = "pending_application_count"];
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  // Окончание по времени не меняет этот статус и не подтверждает участия автоматически.
  EVENT_STATUS_PUBLISHED = 1;
  // Конечный статус. Редактирование и новые заявки запрещены.
  EVENT_STATUS_CANCELLED = 2;
  // Конечный статус: итоги и начисления уже зафиксированы. Чат доступен только для чтения.
  EVENT_STATUS_COMPLETED = 3;
}

// Требования задаются координатором для конкретного мероприятия, а не для всей платформы.
// В MVP это декларируемые условия: автоматическая проверка соответствия не предусмотрена.
// Координатор проверяет соответствие; подробности обучения и необходимого опыта указывает в description.
enum EventCandidateRequirement {
  EVENT_CANDIDATE_REQUIREMENT_UNSPECIFIED = 0;
  // Не менее 14 полных лет на дату начала мероприятия.
  EVENT_CANDIDATE_REQUIREMENT_AGE_14_PLUS = 1;
  // Не менее 16 полных лет на дату начала мероприятия.
  EVENT_CANDIDATE_REQUIREMENT_AGE_16_PLUS = 2;
  // Не менее 18 полных лет на дату начала мероприятия.
  EVENT_CANDIDATE_REQUIREMENT_AGE_18_PLUS = 3;
  // Требуется пройти предварительное обучение для мероприятия.
  EVENT_CANDIDATE_REQUIREMENT_PRELIMINARY_TRAINING = 4;
  // Требуется гражданство Российской Федерации.
  EVENT_CANDIDATE_REQUIREMENT_RUSSIAN_CITIZENSHIP = 5;
  // Требуется опыт волонтёрской деятельности.
  EVENT_CANDIDATE_REQUIREMENT_VOLUNTEERING_EXPERIENCE = 6;
}

// Обёртка позволяет отличить отсутствие изменения от очистки списка в UpdateEventRequest.
message EventCandidateRequirements {
  // Все требования применяются одновременно. Допустим не более одного возрастного порога.
  // Повторы, неизвестные значения и UNSPECIFIED означают InvalidArgument.
  repeated EventCandidateRequirement values = 1 [json_name = "values"];
}

message CreateEventRequest {
  string description = 1 [json_name = "description"];
  // Обязательное непустое название.
  string title = 3 [json_name = "title"];

  string location = 2 [json_name = "location"];
  geo.v1.GeoPoint point = 11 [json_name = "point"];

  // Обе даты обязательны. Начало в будущем и строго раньше окончания.
  // Разность ends_at - starts_at положительна и кратна ровно 1800 секундам.
  google.protobuf.Timestamp starts_at = 4 [json_name = "starts_at"];

  google.protobuf.Timestamp ends_at = 5 [json_name = "ends_at"];

  // Пустой список означает отсутствие требований; все заданные требования применяются одновременно.
  // Допустим не более одного возрастного порога.
  // Повторы, неизвестные значения и UNSPECIFIED означают InvalidArgument.
  repeated EventCandidateRequirement candidate_requirements = 10 [json_name = "candidate_requirements"];
  // Больше нуля.
  int32 volunteer_limit = 6 [json_name = "volunteer_limit"];
}

message CreateEventResponse {
  string id = 1 [json_name = "id"];
}

message GetEventRequest {
  string id = 1 [json_name = "id"];
}

message GetEventResponse {
  Event event = 1 [json_name = "event"];
}

enum EventListScope {
  EVENT_LIST_SCOPE_UNSPECIFIED = 0;
  // Каталог координаторов с активным сотрудничеством; обязательна search_area.
  EVENT_LIST_SCOPE_CATALOG = 1;
  // Только мероприятия с coordinator_id = user_id сессии; требуется Coordinator.
  EVENT_LIST_SCOPE_OWNED = 2;
}

message ListEventsRequest {
  // Обязательно: UNSPECIFIED/неизвестное значение — InvalidArgument.
  // Наличие Coordinator не меняет scope автоматически.
  EventListScope scope = 11 [json_name = "scope"];

  // Дополнительный фильтр внутри доступного каталога; не расширяет права доступа.
  // При передаче должен быть непустым.
  optional string coordinator_id = 1 [json_name = "coordinator_id"];
  // Для CATALOG обязательно; для OWNED необязательный фильтр своих мероприятий.
  // Сервер применяет область вместе с правами и всеми остальными фильтрами до пагинации.
  geo.v1.SearchArea search_area = 8 [json_name = "search_area"];
  // Если отсутствует, возвращаются все статусы. Передавать UNSPECIFIED нельзя.
  optional EventStatus status = 2 [json_name = "status"];

  // Интервал начала мероприятия: from включительно, to исключительно.
  // Каждая граница необязательна; при наличии обеих from должен быть меньше to.
  optional google.protobuf.Timestamp starts_at_from = 3 [json_name = "starts_at_from"];
  optional google.protobuf.Timestamp starts_at_to = 4 [json_name = "starts_at_to"];

  // Интервал окончания: from включительно, to исключительно.
  // Каждая граница необязательна; при наличии обеих from должен быть меньше to.
  // Например, ends_at_to = now выбирает уже закончившиеся по времени мероприятия,
  // в том числе PUBLISHED без подведённых итогов. Все заданные фильтры применяются вместе.
  optional google.protobuf.Timestamp ends_at_from = 9 [json_name = "ends_at_from"];
  optional google.protobuf.Timestamp ends_at_to = 10 [json_name = "ends_at_to"];

  // 0 означает 20 результатов; допустимы 1–100, остальные значения — InvalidArgument.
  int32 limit = 5 [json_name = "limit"];
  // Число пропускаемых записей после фильтрации и сортировки; 0 — с начала.
  // Должно быть неотрицательным, иначе InvalidArgument. За пределами списка — пустая страница.
  // На каждом запросе применяются текущие права доступа и фильтры.
  int64 offset = 7 [json_name = "offset"];
}

message ListEventsResponse {
  // Упорядочены по starts_at, затем id, по возрастанию.
  repeated Event events = 1 [json_name = "events"];
  // Общее число доступных записей с текущими фильтрами, без limit и offset.
  // Подсчитывается в том же снимке данных, что и элементы страницы.
  int64 total_count = 3 [json_name = "total_count"];
}

// Отсутствующие поля не меняются. Отменённое или начавшееся мероприятие
// редактировать нельзя. Нарушение ограничений состояния означает FailedPrecondition.
// Все поля заблокированы, пока есть хотя бы одно
// участие в PENDING или APPROVED. Если таких записей нет, их снова можно менять
// до начала мероприятия. Проверка согласована с созданием и одобрением заявок.
message UpdateEventRequest {
  string id = 1 [json_name = "id"];

  // Пустая строка очищает описание или место проведения.
  optional string description = 2 [json_name = "description"];
  // Пустая строка недопустима.
  optional string title = 4 [json_name = "title"];

  optional string location = 3 [json_name = "location"];
  geo.v1.GeoPoint point = 12 [json_name = "point"];

  // Даты нельзя менять при наличии PENDING или APPROVED.
  // Итоговое начало должно оставаться в будущем и строго раньше окончания.
  // После применения всех изменений разность ends_at - starts_at должна быть
  // положительной и кратной ровно 1800 секундам, как при создании. Проверяются
  // итоговые даты, даже если передана только одна граница; нарушение — InvalidArgument.
  optional google.protobuf.Timestamp starts_at = 5 [json_name = "starts_at"];

  optional google.protobuf.Timestamp ends_at = 6 [json_name = "ends_at"];

  // Отсутствие поля оставляет требования без изменений; переданный объект полностью заменяет список.
  // Объект с пустым values очищает требования. Нельзя менять при наличии PENDING или APPROVED.
  optional EventCandidateRequirements candidate_requirements = 11 [json_name = "candidate_requirements"];
  // Больше нуля. Вся команда запрещена при наличии PENDING/APPROVED.
  optional int32 volunteer_limit = 7 [json_name = "volunteer_limit"];
}

message CancelEventRequest {
  // Текущее состояние должно быть PUBLISHED, а время — строго до starts_at,
  // иначе возвращается FailedPrecondition.
  string id = 1 [json_name = "id"];
}

// Ровно один исход. Отсутствие oneof, false в absent, повторы participation_id — InvalidArgument.
message EventParticipationResult {
  string participation_id = 1 [json_name = "participation_id"];
  oneof outcome {
    bool absent = 3 [json_name = "absent"];
    // Положительное кратное 30; может превышать плановую длительность мероприятия.
    // Сервер начисляет confirmed_minutes / 30 * 5 целых коинов, проверяя переполнение.
    int64 confirmed_minutes = 2 [json_name = "confirmed_minutes"];
  }
}

message CompleteEventRequest {
  string id = 1 [json_name = "id"];

  repeated EventParticipationResult results = 3 [json_name = "results"];

  // Обязательный ключ, уникальный для координатора и RPC. Повтор того же содержимого
  // (порядок строк незначим) возвращает исходный результат без новых начислений.
  // Другой payload с тем же ключом — AlreadyExists.
  // Другой ключ для уже COMPLETED мероприятия — FailedPrecondition.
  string request_id = 4 [json_name = "request_id"];
}

message CompleteEventResponse {
  Event event = 1 [json_name = "event"];
}
