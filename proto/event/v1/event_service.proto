syntax = "proto3";

package event.v1;

import "geo/v1/geo_service.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/event/v1;event_v1";

service EventService {
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {}
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {}
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {}
  rpc UpdateEvent(UpdateEventRequest) returns (google.protobuf.Empty) {}
  rpc CancelEvent(CancelEventRequest) returns (google.protobuf.Empty) {}
  rpc CompleteEvent(CompleteEventRequest) returns (CompleteEventResponse) {}
}

message Event {
  string id = 1 [json_name = "id"];

  string coordinator_id = 2 [json_name = "coordinator_id"];

  string description = 3 [json_name = "description"];
  string image_url = 4 [json_name = "image_url"];
  string title = 5 [json_name = "title"];

  string location = 6 [json_name = "location"];
  geo.v1.GeoPoint point = 7 [json_name = "point"];

  google.protobuf.Timestamp starts_at = 8 [json_name = "starts_at"];

  google.protobuf.Timestamp ends_at = 9 [json_name = "ends_at"];

  repeated EventCandidateRequirement candidate_requirements = 10 [json_name = "candidate_requirements"];
  int32 volunteer_limit = 11 [json_name = "volunteer_limit"];

  EventStatus status = 12 [json_name = "status"];

  int32 approved_participant_count = 13 [json_name = "approved_participant_count"];
  int32 pending_application_count = 14 [json_name = "pending_application_count"];
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_PUBLISHED = 1;
  EVENT_STATUS_CANCELLED = 2;
  EVENT_STATUS_COMPLETED = 3;
}

enum EventCandidateRequirement {
  EVENT_CANDIDATE_REQUIREMENT_UNSPECIFIED = 0;
  EVENT_CANDIDATE_REQUIREMENT_AGE_14_PLUS = 1;
  EVENT_CANDIDATE_REQUIREMENT_AGE_16_PLUS = 2;
  EVENT_CANDIDATE_REQUIREMENT_AGE_18_PLUS = 3;
  EVENT_CANDIDATE_REQUIREMENT_PRELIMINARY_TRAINING = 4;
  EVENT_CANDIDATE_REQUIREMENT_RUSSIAN_CITIZENSHIP = 5;
  EVENT_CANDIDATE_REQUIREMENT_VOLUNTEERING_EXPERIENCE = 6;
}

message EventCandidateRequirements {
  repeated EventCandidateRequirement values = 1 [json_name = "values"];
}

message CreateEventRequest {
  string description = 1 [json_name = "description"];
  string image_path = 2 [json_name = "image_path"];
  string title = 3 [json_name = "title"];

  string location = 4 [json_name = "location"];
  geo.v1.GeoPoint point = 5 [json_name = "point"];

  google.protobuf.Timestamp starts_at = 6 [json_name = "starts_at"];

  google.protobuf.Timestamp ends_at = 7 [json_name = "ends_at"];

  repeated EventCandidateRequirement candidate_requirements = 8 [json_name = "candidate_requirements"];
  int32 volunteer_limit = 9 [json_name = "volunteer_limit"];
}

message CreateEventResponse {
  string id = 1 [json_name = "id"];
}

message GetEventRequest {
  string id = 1 [json_name = "id"];
}

message GetEventResponse {
  Event event = 1 [json_name = "event"];
}

enum EventListScope {
  EVENT_LIST_SCOPE_UNSPECIFIED = 0;
  EVENT_LIST_SCOPE_CATALOG = 1;
  EVENT_LIST_SCOPE_OWNED = 2;
}

message ListEventsRequest {
  EventListScope scope = 1 [json_name = "scope"];

  optional string coordinator_id = 2 [json_name = "coordinator_id"];
  geo.v1.SearchArea search_area = 3 [json_name = "search_area"];
  optional EventStatus status = 4 [json_name = "status"];

  optional google.protobuf.Timestamp starts_at_from = 5 [json_name = "starts_at_from"];
  optional google.protobuf.Timestamp starts_at_to = 6 [json_name = "starts_at_to"];

  optional google.protobuf.Timestamp ends_at_from = 7 [json_name = "ends_at_from"];
  optional google.protobuf.Timestamp ends_at_to = 8 [json_name = "ends_at_to"];

  int32 limit = 9 [json_name = "limit"];
  int64 offset = 10 [json_name = "offset"];
}

message ListEventsResponse {
  repeated Event events = 1 [json_name = "events"];
  int64 total_count = 2 [json_name = "total_count"];
}

message UpdateEventRequest {
  string id = 1 [json_name = "id"];

  optional string description = 2 [json_name = "description"];
  optional string image_path = 3 [json_name = "image_path"];
  optional string title = 4 [json_name = "title"];

  optional string location = 5 [json_name = "location"];
  geo.v1.GeoPoint point = 6 [json_name = "point"];

  optional google.protobuf.Timestamp starts_at = 7 [json_name = "starts_at"];

  optional google.protobuf.Timestamp ends_at = 8 [json_name = "ends_at"];

  optional EventCandidateRequirements candidate_requirements = 9 [json_name = "candidate_requirements"];
  optional int32 volunteer_limit = 10 [json_name = "volunteer_limit"];
}

message CancelEventRequest {
  string id = 1 [json_name = "id"];
}

message EventParticipationResult {
  string participation_id = 1 [json_name = "participation_id"];
  oneof outcome {
    bool absent = 2 [json_name = "absent"];
    int64 confirmed_minutes = 3 [json_name = "confirmed_minutes"];
  }
}

message CompleteEventRequest {
  string id = 1 [json_name = "id"];

  repeated EventParticipationResult results = 2 [json_name = "results"];

  string request_id = 3 [json_name = "request_id"];
}

message CompleteEventResponse {
  Event event = 1 [json_name = "event"];
}
