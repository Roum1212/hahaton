syntax = "proto3";

package geo.v1;

option go_package = "github.com/Roum1212/hahaton/genproto/geo/v1;geo_v1";

service GeoService {
  rpc SuggestAddresses(SuggestAddressesRequest) returns (SuggestAddressesResponse) {}
  rpc ListCities(ListCitiesRequest) returns (ListCitiesResponse) {}
  rpc GetCity(GetCityRequest) returns (GetCityResponse) {}
}

message GeoPoint {
  optional double latitude = 1 [json_name = "latitude"];
  optional double longitude = 2 [json_name = "longitude"];
}

message City {
  string id = 1 [json_name = "id"];

  string name = 2 [json_name = "name"];
  string region_name = 3 [json_name = "region_name"];

  GeoPoint center = 4 [json_name = "center"];
  bool has_boundary = 5 [json_name = "has_boundary"];
}

message RadiusArea {
  GeoPoint center = 1 [json_name = "center"];
  int32 radius_meters = 2 [json_name = "radius_meters"];
}

message SearchArea {
  oneof area {
    string city_id = 1 [json_name = "city_id"];
    RadiusArea radius = 2 [json_name = "radius"];
  }
}

message ListCitiesRequest {
  optional string query = 1 [json_name = "query"];

  int32 limit = 2 [json_name = "limit"];
  int64 offset = 3 [json_name = "offset"];
}

message ListCitiesResponse {
  repeated City cities = 1 [json_name = "cities"];

  string catalog_version = 2 [json_name = "catalog_version"];

  int64 total_count = 3 [json_name = "total_count"];
}

message GetCityRequest {
  string id = 1 [json_name = "id"];
}

message GetCityResponse {
  City city = 1 [json_name = "city"];

  string catalog_version = 2 [json_name = "catalog_version"];
}

message AddressBound {
  string value = 1 [json_name = "value"];
}

message SuggestAddressesRequest {
  string query = 1 [json_name = "query"];

  AddressBound from_bound = 2 [json_name = "from_bound"];
  AddressBound to_bound = 3 [json_name = "to_bound"];

  int32 count = 4 [json_name = "count"];
}

message AddressSuggestion {
  string unrestricted_value = 1 [json_name = "unrestricted_value"];
  string value = 2 [json_name = "value"];

  AddressSuggestionData data = 3 [json_name = "data"];
}

message AddressSuggestionData {
  optional string city_fias_id = 1 [json_name = "city_fias_id"];
  optional string fias_id = 2 [json_name = "fias_id"];
  optional string settlement_fias_id = 3 [json_name = "settlement_fias_id"];

  optional string city_with_type = 4 [json_name = "city_with_type"];
  optional string region_with_type = 5 [json_name = "region_with_type"];
  optional string settlement_with_type = 6 [json_name = "settlement_with_type"];

  GeoPoint point = 7 [json_name = "point"];
  optional int32 qc_geo = 8 [json_name = "qc_geo"];
}

message SuggestAddressesResponse {
  repeated AddressSuggestion suggestions = 1 [json_name = "suggestions"];
}
