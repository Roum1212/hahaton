syntax = "proto3";

package volunteer.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/volunteer/v1;volunteer_v1";

service VolunteerService {
  rpc GetVolunteer(GetVolunteerRequest) returns (GetVolunteerResponse) {}
  rpc GetCoordinatorVolunteer(GetCoordinatorVolunteerRequest) returns (GetCoordinatorVolunteerResponse) {}
  rpc UpdateVolunteer(UpdateVolunteerRequest) returns (google.protobuf.Empty) {}
  rpc ListVolunteerOperations(ListVolunteerOperationsRequest) returns (ListVolunteerOperationsResponse) {}
}

message Volunteer {
  string id = 1 [json_name = "id"];

  string avatar_url = 2 [json_name = "avatar_url"];
  google.type.Date date_of_birth = 3 [json_name = "date_of_birth"];
  string first_name = 4 [json_name = "first_name"];
  string last_name = 5 [json_name = "last_name"];
  string middle_name = 6 [json_name = "middle_name"];

  string email_address = 7 [json_name = "email_address"];
  string phone_number = 8 [json_name = "phone_number"];

  int64 coin_balance = 9 [json_name = "coin_balance"];
  int64 confirmed_minutes = 10 [json_name = "confirmed_minutes"];
}

message GetVolunteerRequest {
  optional string id = 1 [json_name = "id"];
}

message GetVolunteerResponse {
  Volunteer volunteer = 1 [json_name = "volunteer"];
}

message CoordinatorVolunteer {
  string id = 1 [json_name = "id"];

  string avatar_url = 2 [json_name = "avatar_url"];
  string first_name = 3 [json_name = "first_name"];
  string last_name = 4 [json_name = "last_name"];
  string middle_name = 5 [json_name = "middle_name"];

  optional string email_address = 6 [json_name = "email_address"];
  optional string phone_number = 7 [json_name = "phone_number"];
}

message GetCoordinatorVolunteerRequest {
  string volunteer_id = 1 [json_name = "volunteer_id"];
}

message GetCoordinatorVolunteerResponse {
  CoordinatorVolunteer volunteer = 1 [json_name = "volunteer"];
}

message UpdateVolunteerRequest {
  optional string avatar_path = 1 [json_name = "avatar_path"];
  optional google.type.Date date_of_birth = 2 [json_name = "date_of_birth"];
  optional string first_name = 3 [json_name = "first_name"];
  optional string last_name = 4 [json_name = "last_name"];
  optional string middle_name = 5 [json_name = "middle_name"];
}

message VolunteerOperation {
  string id = 1 [json_name = "id"];

  string coordinator_id = 2 [json_name = "coordinator_id"];
  string volunteer_id = 3 [json_name = "volunteer_id"];

  string description = 4 [json_name = "description"];
  VolunteerOperationType type = 5 [json_name = "type"];

  oneof source {
    string participation_id = 6 [json_name = "participation_id"];
    string reward_order_id = 7 [json_name = "reward_order_id"];
  }

  int64 coin_delta = 8 [json_name = "coin_delta"];
  int64 minute_delta = 9 [json_name = "minute_delta"];

  int64 coin_balance_after = 10 [json_name = "coin_balance_after"];
  int64 confirmed_minutes_after = 11 [json_name = "confirmed_minutes_after"];

  uint64 sequence = 12 [json_name = "sequence"];

  google.protobuf.Timestamp created_at = 13 [json_name = "created_at"];
}

enum VolunteerOperationType {
  VOLUNTEER_OPERATION_TYPE_UNSPECIFIED = 0;
  VOLUNTEER_OPERATION_TYPE_PARTICIPATION_ACCRUAL = 1;
  VOLUNTEER_OPERATION_TYPE_REWARD_PURCHASE = 2;
  VOLUNTEER_OPERATION_TYPE_REWARD_REFUND = 3;
}

message ListVolunteerOperationsRequest {
  optional VolunteerOperationType type = 1 [json_name = "type"];

  int32 limit = 2 [json_name = "limit"];
  int64 offset = 3 [json_name = "offset"];
}

message ListVolunteerOperationsResponse {
  repeated VolunteerOperation operations = 1 [json_name = "operations"];
  int64 total_count = 2 [json_name = "total_count"];
}
