syntax = "proto3";

package session.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Roum1212/hahaton/genproto/session/v1;session_v1";

service SessionService {
  rpc OpenSession(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc AuthenticateSession(AuthenticateSessionRequest) returns (google.protobuf.Empty) {}
  rpc GetSession(google.protobuf.Empty) returns (GetSessionResponse) {}
  rpc CloseSession(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

message Session {
  optional string user_id = 1 [json_name = "user_id"];

  bool has_coordinator_profile = 2 [json_name = "has_coordinator_profile"];

  google.protobuf.Timestamp expires_at = 3 [json_name = "expires_at"];
}

message AuthenticateSessionRequest {
  string id_token = 1 [json_name = "id_token"];
}

message GetSessionResponse {
  Session session = 1 [json_name = "session"];
}
