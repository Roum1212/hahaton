version: v2

breaking:
  use:
    - FILE
  ignore:
    - third_party

lint:
  use:
    - STANDARD
  rpc_allow_google_protobuf_empty_responses: true
  # Сохраняем выбранные имена директорий с дефисами; protobuf-пакеты используют подчёркивания.
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - proto/event-chat
      - proto/reward-order
  ignore:
    - third_party

modules:
  - path: proto
  - path: third_party
